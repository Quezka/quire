name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0
      - run: pytest -q

  package:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build: --deb
            artifact: dist/*.deb
          - os: windows-latest
            build: --onefile
            artifact: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"
      - run: python scripts/build.py ${{ matrix.build }}
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: Quire-${{ runner.os }}
          path: ${{ matrix.artifact }}
