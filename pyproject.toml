[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quire"
dynamic = ["version"]
description = "Notes, day planner and school timetable in one native desktop app"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "keyring>=24", "segno>=1.5"]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.gui-scripts]
quire = "quire.app:main"

[tool.setuptools.dynamic]
version = {attr = "quire.__version__"}

[tool.setuptools.packages.find]
include = ["quire*"]

[tool.setuptools.package-data]
quire = ["assets/*"]
